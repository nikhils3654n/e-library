<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reports | E-LIBRARY</title><link rel="stylesheet" href="style.css">
<script src="books-data.js"></script><script src="auth.js"></script>
<script>protectPage();</script>
<style>
.role-pill{display:inline-block;background:linear-gradient(90deg,var(--primary),var(--secondary));color:#fff;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.5px;margin-bottom:8px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar-label{width:150px;font-size:14px;color:var(--text);flex-shrink:0}
.bar-track{flex:1;background:#eef2ff;border-radius:99px;height:16px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--pink))}
.bar-count{width:34px;text-align:right;font-weight:700;color:var(--primary);flex-shrink:0}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="librarian-dashboard.html"><span class="brand-icon">📖</span>E-LIBRARY</a>
<nav class="nav"><a href="librarian-dashboard.html">Dashboard</a><a href="add-book.html">Add Book</a><a href="manage-books.html">Manage Books</a><a href="issue-return.html">Issue/Return</a><a class="active" href="librarian-reports.html">Reports</a><a href="login.html" data-logout>Logout</a></nav></header>

<main class="container">
<span class="role-pill">🧑‍💼 Librarian Portal</span>
<div class="page-head"><h1>Reports</h1><p>A quick look at the catalog by category and status.</p></div>

<div class="grid" id="statGrid" style="margin-bottom:10px"></div>

<div class="section-title"><h2>Books by Category</h2></div>
<div class="card" id="categoryChart"></div>

<div class="section-title"><h2>Books by Status</h2></div>
<div class="card" id="statusChart"></div>
</main>

<footer class="footer"><strong>E-LIBRARY</strong><p>Online Book Management and Reading System • Librarian Portal</p></footer>

<script>
function countBy(list, key) {
  const counts = {};
  list.forEach(item => { counts[item[key]] = (counts[item[key]] || 0) + 1; });
  return counts;
}

function renderBarChart(container, counts, labelFn) {
  const max = Math.max(...Object.values(counts), 1);
  container.innerHTML = Object.entries(counts).map(([key, count]) => `
    <div class="bar-row">
      <div class="bar-label">${labelFn ? labelFn(key) : key}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count / max) * 100}%"></div></div>
      <div class="bar-count">${count}</div>
    </div>
  `).join("");
}

function renderReports() {
  const total = BOOKS.length;
  const available = BOOKS.filter(b => b.status === "available").length;
  const categories = new Set(BOOKS.map(b => b.category)).size;

  document.getElementById("statGrid").innerHTML = `
    <div class="card stat"><div class="icon">📚</div><div><h3>${total}</h3><p>Total Books</p></div></div>
    <div class="card stat"><div class="icon">✅</div><div><h3>${available}</h3><p>Available Now</p></div></div>
    <div class="card stat"><div class="icon">🏷️</div><div><h3>${categories}</h3><p>Categories</p></div></div>
    <div class="card stat"><div class="icon">🔄</div><div><h3>${total - available}</h3><p>Out on Loan / Reserved</p></div></div>
  `;

  renderBarChart(document.getElementById("categoryChart"), countBy(BOOKS, "category"));
  renderBarChart(document.getElementById("statusChart"), countBy(BOOKS, "status"), statusLabel);
}

document.addEventListener("DOMContentLoaded", renderReports);
</script>
</body></html>
